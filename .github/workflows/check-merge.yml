name: Check Merge Validity

on:
  push:
    branches:
      - trunk

jobs:
  validate-merge:
    name: Validate Merge to Trunk
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }} # Necesario para consultar la API de GitHub Actions

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (gh + jq)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq curl
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt-get update -y
          sudo apt-get install -y gh

      - name: Detect source branch of merge
        id: detect_branch
        run: |
          echo "🔍 Detectando rama feature_task_X desde el último commit de trunk..."
          LAST_COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Último commit: $LAST_COMMIT_MSG"

          FEATURE_BRANCH=$(echo "$LAST_COMMIT_MSG" | grep -oE 'feature_task_[0-9]+' || true)

          if [ -z "$FEATURE_BRANCH" ]; then
            echo "❌ No se detectó una rama feature_task_X en el mensaje del commit."
            echo "Asegúrate de incluir algo como 'Merge feature_task_3 into trunk' en el mensaje del merge."
            echo "feature_branch=unknown" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "✅ Merge detectado desde la rama: $FEATURE_BRANCH"
          echo "feature_branch=$FEATURE_BRANCH" >> $GITHUB_OUTPUT

      - name: Check Codacy CI status on source branch
        if: steps.detect_branch.outputs.feature_branch != 'unknown'
        run: |
          FEATURE_BRANCH="${{ steps.detect_branch.outputs.feature_branch }}"

          echo "🕵️‍♂️ Verificando estado del último workflow 'Codacy CI' en la rama $FEATURE_BRANCH..."

          RUN_STATUS=$(gh run list \
            --branch "$FEATURE_BRANCH" \
            --workflow "Codacy CI" \
            --json conclusion,status \
            --limit 1 | jq -r '.[0].conclusion')

          if [ "$RUN_STATUS" != "success" ]; then
            echo "🚫 El último workflow 'Codacy CI' en la rama $FEATURE_BRANCH no pasó correctamente (estado: $RUN_STATUS)."
            echo "❌ Merge NO válido — por favor revisa los errores en GitHub Actions."
            exit 1
          fi

          echo "✅ El último workflow 'Codacy CI' en $FEATURE_BRANCH fue exitoso. Merge válido."
